name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Static checks plus the full suite.
  #
  # A real Postgres service runs here so the multi-worker concurrency tests
  # execute rather than skip: PGlite is a single connection and cannot exercise
  # FOR UPDATE SKIP LOCKED at all, and "exactly once under contention" is the
  # product claim. Without TEST_DATABASE_URL the suite falls back to PGlite and
  # those tests are reported as skipped.
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 22.x]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: overlay_test
          POSTGRES_PASSWORD: overlay_test
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://overlay_test:overlay_test@127.0.0.1:5433/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Zendesk app manifest
        run: npm run app:validate

      - name: Test
        run: npm test

      - name: Assert concurrency suite actually ran
        run: |
          # A silent skip here would hide the one property that cannot be
          # verified any other way.
          npx vitest run apps/api/test/concurrency.test.ts --reporter=json \
            > .tmp-concurrency.json
          node -e "
            const r = require('./.tmp-concurrency.json');
            if (r.numTotalTests === 0 || r.numPassedTests === 0) {
              console.error('Concurrency tests did not execute against a real Postgres');
              process.exit(1);
            }
            console.log(\`Concurrency tests passed: \${r.numPassedTests}\`);
          "

      - name: Build Zendesk app package
        run: npm run app:package

  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce no .env file policy
        run: |
          if [ -f .env ]; then
            echo ".env file detected in repository workspace"
            exit 1
          fi

      # Guards against re-introducing credentials with published values. The
      # webhook secret defaults belong here because they were real: any
      # deployment that did not override them could be forged against.
      - name: Enforce no committed default credentials
        run: |
          patterns=(
            "operator-token-dev"
            "agent-token-dev"
            "dev_operator_token"
            "dev_zendesk_webhook_secret"
            "dev_stripe_webhook_secret"
            "dev_shopify_webhook_secret"
            "API_HOST=0.0.0.0"
          )
          joined=$(IFS="|"; echo "${patterns[*]}")
          if rg --hidden --glob '!.git' --glob '!*.yml' -n -e "$joined" .; then
            echo "Committed default credential detected."
            exit 1
          fi

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://iisl:ci_pg_${{ github.run_id }}_${{ github.run_attempt }}@127.0.0.1:5432/iisl
      POSTGRES_USER: iisl
      POSTGRES_PASSWORD: ci_pg_${{ github.run_id }}_${{ github.run_attempt }}
      POSTGRES_DB: iisl
      POSTGRES_PORT: "5432"
      API_PORT: "3001"
      API_HOST: 127.0.0.1
      OPERATOR_TOKEN: ci_operator_${{ github.run_id }}_${{ github.run_attempt }}
      AGENT_TOKEN: ci_agent_${{ github.run_id }}_${{ github.run_attempt }}
      WEBHOOK_TOKEN: ci_webhook_${{ github.run_id }}_${{ github.run_attempt }}
      WORKER_POLL_INTERVAL_MS: "2000"
      WORKER_MAX_ATTEMPTS: "5"
      USE_ZENDESK_SIMULATOR: "true"
      USE_STRIPE_SIMULATOR: "true"
      USE_SHOPIFY_SIMULATOR: "true"
      VITE_API_BASE_URL: http://localhost:3001
      VITE_AGENT_TOKEN: ci_agent_${{ github.run_id }}_${{ github.run_attempt }}
      SIDEBAR_PORT: "5173"
      LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start demo services
        run: |
          mkdir -p .tmp/ci-logs
          npm run demo:start > .tmp/ci-logs/demo-start.log 2>&1 &
          echo $! > .tmp/demo-start.pid

      - name: Wait for API readiness
        run: |
          for i in {1..120}; do
            if curl -fsS "http://127.0.0.1:${API_PORT}/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time on port ${API_PORT}"
          tail -n 300 .tmp/ci-logs/demo-start.log || true
          exit 1

      - name: Run smoke tests
        run: npm run demo:smoke

      - name: Stop services
        if: always()
        run: |
          if [ -f .tmp/demo-start.pid ]; then
            kill "$(cat .tmp/demo-start.pid)" || true
          fi
          npm run infra:down || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: .tmp/ci-logs
